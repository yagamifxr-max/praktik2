<!DOCTYPE html>
<html>
<head>
    <title>Data Siswa</title>

    <style>
        body{
            margin:0;
            padding:40px;
            background:#eef4ff;
            font-family:Arial, sans-serif;
        }

        h1{
            text-align:center;
            color:#ffffff;
            background:#6c8cff;
            width:350px;
            margin:20px auto;
            padding:15px;
            border-radius:12px;
            box-shadow:0px 5px 10px rgba(0,0,0,0.2);
        }

        table{
            width:95%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0px 5px 15px rgba(0,0,0,0.15);
        }

        th{
            background:#7ea8ff;
            color:white;
            padding:15px;
            border:1px solid #b7c9ff;
            font-size:18px;
        }

        td{
            padding:18px;
            border:1px solid #b7c9ff;
            text-align:left;
            vertical-align:top;
            font-size:16px;
        }

        tr:nth-child(even){
            background:#f5f8ff;
        }

        tr:hover{
            background:#dfe9ff;
        }
    </style>

</head>

<body>

<h1>DATA SISWA</h1>

<table>

    <tr>
        <th width="20%">Nama</th>
        <th width="15%">Kelas</th>
        <th width="35%">Alamat</th>
        <th width="30%">Hobi</th>
    </tr>

    <tr>
        <td>Najmi Aliu</td>
        <td>XI RPL</td>
        <td>Jl. Mujair 3 RT 08/RW 04, Kel. Bambu Apus, Kec. Pamulang</td>
        <td>Membaca artikel dan mencari pengetahuan tentang filsafat</td>
    </tr>

</table>

</body>
</html>
